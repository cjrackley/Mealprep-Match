name: build

# The pull request is the gate: it tests the merge result of every commit on the
# branch at once, so per-push runs on feature branches would only re-test states
# nobody is going to merge. The push trigger covers what actually lands on main.
on:
  pull_request:
  push:
    branches: [main]

# A new push to an open PR supersedes the run already in flight rather than
# queueing a second one. Only the tip of the branch is ever worth testing.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Maven lives in backend-api/, not the repo root.
    defaults:
      run:
        working-directory: backend-api

    # An empty Postgres on every run, which is what MealPrepMatchApplicationTests
    # needs to boot. Starting empty is the point: ddl-auto=update has to build the
    # whole schema from the entity mappings before contextLoads can pass.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mealprep
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # There are no spring.datasource.username/password properties, so the
      # credentials have to be embedded in the URL. See HANDOFF.md section 1.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mealprep?user=postgres&password=ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # mvnw is committed as mode 100644, so the exec bit is missing on Linux.
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress clean verify
